<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务执行日志</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .table {
            font-size: 14px;
        }
        .table th {
            background-color: #f8f9fa;
        }
        .fs-14 {
            font-size: 14px;
        }
        .text-break {
            word-break: break-all;
            max-width: 200px;
        }
        .alert {
            border-radius: 8px;
        }
        .pagination {
            flex-wrap: wrap;
        }
        .pagination .page-link {
            padding: 0.375rem 0.75rem;
        }
        @media (max-width: 768px) {
            .table-responsive {
                font-size: 12px;
            }
            .btn-sm {
                font-size: 12px;
                padding: 0.25rem 0.5rem;
            }
            .pagination .page-link {
                padding: 0.25rem 0.5rem;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
<th:block th:include="index"></th:block>

<th:block th:fragment="content">
    <div class="container mt-4">

        <!-- ==================== 提示消息 ==================== -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- ==================== 标题和操作按钮 ==================== -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h5 class="mb-0">
                    <i class="bi bi-clock-history"></i> 任务执行日志
                    <span th:if="${taskId != null}" class="badge bg-secondary ms-2">任务ID: <span th:text="${taskId}"></span></span>
                </h5>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-secondary btn-sm" onclick="refreshLog()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
                <button class="btn btn-danger btn-sm" onclick="clearAllLog()">
                    <i class="bi bi-trash3"></i> 清空日志
                </button>
                <a th:href="@{/task/list}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> 返回任务列表
                </a>
            </div>
        </div>

        <!-- ==================== 日志表格 ==================== -->
        <div class="card shadow-sm mb-4">
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th width="60">ID</th>
                        <th>任务名称</th>
                        <th>请求地址</th>
                        <th width="100">执行状态</th>
                        <th width="110">耗时(ms)</th>
                        <th width="170">执行时间</th>
                        <th width="120">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${page.records}">
                        <td th:text="${item.id}"></td>
                        <td th:text="${item.taskName}"></td>
                        <td class="text-break" th:text="${item.requestUrl}"></td>
                        <td>
                            <span th:if="${item.executeStatus == 1}" class="badge bg-success">
                                <i class="bi bi-check-circle"></i> 成功
                            </span>
                            <span th:if="${item.executeStatus == 0}" class="badge bg-danger">
                                <i class="bi bi-x-circle"></i> 失败
                            </span>
                        </td>
                        <td>
                            <span th:if="${item.costTime != null}" th:text="${item.costTime}"></span>
                            <span th:if="${item.costTime == null}" class="text-muted">-</span>
                        </td>
                        <td th:text="${#temporals.format(item.executeTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                        <td>
                            <a th:href="@{/log/detail(id=${item.id})}" class="btn btn-sm btn-info">
                                <i class="bi bi-eye"></i> 详情
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.records)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            暂无执行日志记录
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ==================== 分页 ==================== -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="text-muted fs-14">
                共 <span th:text="${page.total}"></span> 条记录，
                第 <span th:text="${page.pageNum}"></span>/<span th:text="${page.pages}"></span> 页
            </span>
            <ul class="pagination mb-0" th:if="${page.pages > 1}">
                <!-- 首页 -->
                <li class="page-item" th:class="${page.pageNum == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/log/list(pageNum=1, pageSize=${pageSize}, taskId=${taskId})}">首页</a>
                </li>
                <!-- 上一页 -->
                <li class="page-item" th:class="${page.pageNum == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/log/list(pageNum=${page.pageNum - 1}, pageSize=${pageSize}, taskId=${taskId})}">上一页</a>
                </li>

                <!-- 页码（智能显示） -->
                <th:block th:each="num : ${#numbers.sequence(1, page.pages)}">
                    <li class="page-item" th:class="${num == page.pageNum} ? 'active'">
                        <a class="page-link" th:href="@{/log/list(pageNum=${num}, pageSize=${pageSize}, taskId=${taskId})}" th:text="${num}"></a>
                    </li>
                </th:block>

                <!-- 下一页 -->
                <li class="page-item" th:class="${page.pageNum == page.pages} ? 'disabled'">
                    <a class="page-link" th:href="@{/log/list(pageNum=${page.pageNum + 1}, pageSize=${pageSize}, taskId=${taskId})}">下一页</a>
                </li>
                <!-- 末页 -->
                <li class="page-item" th:class="${page.pageNum == page.pages} ? 'disabled'">
                    <a class="page-link" th:href="@{/log/list(pageNum=${page.pages}, pageSize=${pageSize}, taskId=${taskId})}">末页</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- ==================== JavaScript ==================== -->
    <script th:inline="javascript">
        // 获取当前 taskId（用于 JS 操作）
        var currentTaskId = [[${taskId}]];

        /**
         * 刷新当前页
         */
        function refreshLog() {
            var url = '/log/list?pageNum=' + [[${page.pageNum}]] + '&pageSize=' + [[${pageSize}]];
            if (currentTaskId) {
                url += '&taskId=' + currentTaskId;
            }
            location.href = url;
        }

        /**
         * 清空指定任务的所有日志
         */
        function clearAllLog() {
            if (!currentTaskId) {
                alert('请指定要清空日志的任务ID');
                return;
            }
            if (confirm('确定要清空当前任务（ID: ' + currentTaskId + '）下所有执行日志吗？\n删除后无法恢复！')) {
                // 使用 POST 请求方式（更安全）
                var form = document.createElement('form');
                form.method = 'POST';
                form.action = '/log/clear';
                var input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'taskId';
                input.value = currentTaskId;
                form.appendChild(input);
                document.body.appendChild(form);
                form.submit();
            }
        }

        /**
         * 查看日志详情（新窗口打开）
         */
        function viewDetail(logId) {
            window.open('/log/detail?id=' + logId, '_blank');
        }

        /**
         * 删除单条日志
         */
        function deleteLog(logId) {
            if (confirm('确定要删除这条日志吗？')) {
                var form = document.createElement('form');
                form.method = 'POST';
                form.action = '/log/delete';
                var inputId = document.createElement('input');
                inputId.type = 'hidden';
                inputId.name = 'id';
                inputId.value = logId;
                form.appendChild(inputId);
                if (currentTaskId) {
                    var inputTask = document.createElement('input');
                    inputTask.type = 'hidden';
                    inputTask.name = 'taskId';
                    inputTask.value = currentTaskId;
                    form.appendChild(inputTask);
                }
                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
</th:block>

<!-- Bootstrap JS（用于关闭 alert） -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
