<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table {
            font-size: 14px;
        }
        .table th {
            background-color: #f8f9fa;
        }
        .fs-14 {
            font-size: 14px;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<th:block th:include="index"></th:block>

<th:block th:fragment="content">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0">任务执行日志</h5>
            <div class="d-flex gap-2">
                <form th:action="@{/log/list}" method="get" class="d-inline">
                    <input type="hidden" name="taskId" th:value="${taskId}">
                    <button class="btn btn-secondary btn-sm">
                        <i class="bi bi-arrow-clockwise"></i> 刷新日志
                    </button>
                </form>
                <button class="btn btn-danger btn-sm" onclick="clearAllLog()">
                    <i class="bi bi-trash3"></i> 清空日志
                </button>
                <a th:href="@{/task/list}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> 返回任务列表
                </a>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover mb-0">
                    <thead>
                    <tr>
                        <th width="60">ID</th>
                        <th>任务名称</th>
                        <th>请求地址</th>
                        <th width="100">执行状态</th>
                        <th width="110">耗时(ms)</th>
                        <th>执行时间</th>
                        <th width="120">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${page.records}">
                        <td th:text="${item.id}"></td>
                        <td th:text="${item.taskName}"></td>
                        <td class="text-break" th:text="${item.requestUrl}"></td>
                        <td>
                            <span th:if="${item.executeStatus == 1}" class="badge bg-success">成功</span>
                            <span th:if="${item.executeStatus == 0}" class="badge bg-danger">失败</span>
                        </td>
                        <td th:text="${item.costTime}"></td>
                        <td th:text="${item.executeTime}"></td>
                        <td>
                            <a th:href="@{/log/detail(id=${item.id})}" class="btn btn-sm btn-info">
                                <i class="bi bi-eye"></i> 查看详情
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.records)}">
                        <td colspan="7" class="text-center text-muted py-4">暂无执行日志记录</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="text-muted fs-14">
                共 <span th:text="${page.total}"></span> 条记录，第 <span th:text="${page.pageNum}"></span>/<span th:text="${page.pages}"></span> 页
            </span>
            <ul class="pagination mb-0">
                <li class="page-item" th:class="${page.pageNum == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/log/list(pageNum=1,taskId=${taskId})}">首页</a>
                </li>
                <li class="page-item" th:class="${page.pageNum == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/log/list(pageNum=${page.pageNum - 1},taskId=${taskId})}">上一页</a>
                </li>

                <th:block th:each="num : ${#numbers.sequence(1, page.pages)}">
                    <li class="page-item" th:class="${num == page.pageNum} ? 'active'">
                        <a class="page-link" th:href="@{/log/list(pageNum=${num},taskId=${taskId})}" th:text="${num}"></a>
                    </li>
                </th:block>

                <li class="page-item" th:class="${page.pageNum == page.pages} ? 'disabled'">
                    <a class="page-link" th:href="@{/log/list(pageNum=${page.pageNum + 1},taskId=${taskId})}">下一页</a>
                </li>
                <li class="page-item" th:class="${page.pageNum == page.pages} ? 'disabled'">
                    <a class="page-link" th:href="@{/log/list(pageNum=${page.pages},taskId=${taskId})}">末页</a>
                </li>
            </ul>
        </div>
    </div>

    <script>
        function clearAllLog(){
            if(confirm('确定要清空当前任务下所有执行日志吗？删除后无法恢复！')){
                location.href = '[[@{/log/clear}]]?taskId=' + [[${taskId}]];
            }
        }
    </script>
</th:block>

</body>
</html>
