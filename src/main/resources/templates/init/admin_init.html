<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>系统初始化</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.container{max-width:450px;margin-top:100px}</style>
</head>
<body>
<div class="container card p-4 shadow">
    <h4 class="text-center mb-4">首次初始化，请设置管理员账号</h4>
    <div th:if="${msg}" class="alert alert-danger" th:text="${msg}"></div>
    <form th:action="@{/init/save}" method="post">
        <div class="mb-3">
            <label>用户名</label>
            <input type="text" name="username" class="form-control" required minlength="3">
        </div>
        <div class="mb-3">
            <label>密码(至少6位)</label>
            <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
            <label>确认密码</label>
            <input type="password" name="confirmPwd" class="form-control" required minlength="6">
        </div>
        <button class="btn btn-primary w-100">初始化并保存</button>
    </form>
</div>
</body>
</html>
