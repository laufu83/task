<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.login-box{max-width:420px;margin:80px auto}</style>
</head>
<body>
<div class="login-box card p-4 shadow">
    <h4 class="text-center mb-4">HTTP定时调度平台</h4>
    <div th:if="${msg}" class="alert alert-danger" th:text="${msg}"></div>
    <form th:action="@{/doLogin}" method="post">
        <div class="mb-3">
            <label>用户名</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>密码</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100">登录</button>
    </form>
</div>
</body>
</html>
